name: Deploy to Firebase Hosting

# เว็บจริง: https://rbp-chanikarnn.web.app (app) และ /central/ (เว็บส่วนกลาง)
# merge เข้า main = ขึ้นเว็บจริงอัตโนมัติ (พาท 3 ของการย้าย แทนแอปเดิมที่ใช้ Firestore)
#   ย้อนเวอร์ชัน: Firebase Console > Hosting > ประวัติการ release > Rollback
#   GitHub Pages (deploy-pages.yml) เหลือแค่หน้าพาไปที่อยู่ใหม่ (พาท 4)
#
# deploy เฉพาะ hosting (ไม่แตะ Firestore / Storage / กฎความปลอดภัยของแอปเดิม)
# ต้องมี secret FIREBASE_SERVICE_ACCOUNT_RBP_CHANIKARNN (JSON ของ service account)
# ไม่มี secret = build อย่างเดียว ไม่ deploy (ไม่ทำให้รอบ deploy ขึ้นสีแดง)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RBP_CHANIKARNN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: central/package-lock.json

      - name: ติดตั้ง dependencies ของเว็บส่วนกลาง
        working-directory: central
        run: npm ci

      # แม่แบบฟอร์มเริ่มต้นของ app สร้างจากโค้ด web ทุกครั้งก่อน build
      # app จึงตรงกับ web เสมอ แม้ลืมรันเองหลังแก้ leaveTemplate.ts / tripTemplate.ts
      - name: สร้างแม่แบบฟอร์มเริ่มต้นให้ app
        working-directory: central
        run: npm run form-defaults

      # ชุดทดสอบตัววาดเอกสาร: HTML ที่ web วาดจริงจากโค้ดล่าสุด
      - name: สร้างชุดทดสอบตัววาดเอกสารจาก web
        working-directory: central
        run: npm run form-fixtures

      - name: ติดตั้ง dependencies
        run: flutter pub get

      # ตัววาดของ app ต้องได้เอกสารเดียวกับ web ทุกตัวอักษร
      # ไม่ผ่าน = ไม่ deploy (เว็บเดิมยังใช้งานได้) ใบที่ครูพิมพ์จะได้ไม่ต่างจากที่ออกแบบไว้
      # (ย้ายมาจาก deploy-pages.yml ตอนเลิกใช้ GitHub Pages)
      - name: เทียบตัววาดเอกสาร app กับ web
        run: flutter test test/form_template_test.dart test/form_render_parity_test.dart

      - name: ตรวจสอบโค้ด (ไม่บล็อกการ deploy)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Firebase เสิร์ฟที่ราก (/)
      # APP_BUILD + app-version.json: แอปเทียบสองค่านี้แล้วขึ้นแถบ "มีเวอร์ชันใหม่"
      # (lib/services/update_checker.dart)
      - name: Build Flutter web
        run: |
          flutter build web --release --base-href / --dart-define=APP_BUILD=${{ github.sha }}
          echo '{"build":"${{ github.sha }}"}' > build/web/app-version.json

      # ล้างแคชของแอปเดิมในเครื่องผู้ใช้ (ดู hosting/flutter_service_worker.js)
      - name: วางตัวล้างแอปเดิม
        run: cp hosting/flutter_service_worker.js build/web/flutter_service_worker.js

      - name: Build เว็บผู้ดูแลส่วนกลาง
        working-directory: central
        run: npm run build -- --base /central/

      - name: รวมเว็บส่วนกลางเข้าไปในเว็บหลัก
        run: cp -r central/dist build/web/central

      # merge หลาย PR ติดกัน: deploy เฉพาะรอบที่ยังเป็น commit ล่าสุดของ main
      - name: ตรวจว่ายังเป็นเวอร์ชันล่าสุดของ main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ข้าม deploy — main มี commit ใหม่กว่าแล้ว ($head)"
          fi

      - name: ยังไม่ได้ตั้ง secret — ข้าม deploy
        if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "::notice::ยังไม่มี secret FIREBASE_SERVICE_ACCOUNT_RBP_CHANIKARNN — build ผ่านแต่ไม่ deploy"

      # channelId: live = เว็บจริง (เดิมพาท 1–2 ใช้ลิงก์ทดสอบ channel test)
      - name: Deploy ขึ้นเว็บจริง
        id: preview
        if: env.HAS_FIREBASE_SECRET == 'true' && steps.latest.outputs.is_latest == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RBP_CHANIKARNN }}
          projectId: rbp-chanikarnn
          channelId: live
          # ล็อกเวอร์ชัน — ค่าเริ่มต้นคือ latest ซึ่ง 15.34.1 (28 ต.ค. 2569) เพิ่มการเช็ก
          # serviceusage.services.get ที่ service account นี้ไม่มีสิทธิ์ → deploy 403
          # จะอัปเวอร์ชัน: ให้สิทธิ์ "Service Usage Consumer" กับ service account ก่อน
          firebaseToolsVersion: 15.34.0

      - name: เว็บจริง
        if: steps.preview.outcome == 'success'
        run: echo "::notice::ขึ้นเว็บจริงแล้ว https://rbp-chanikarnn.web.app"
