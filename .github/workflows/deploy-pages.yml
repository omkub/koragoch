name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละครั้ง ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # เว็บผู้ดูแลระบบส่วนกลาง (React) — วางไว้ใต้แอป Flutter ที่ /koragoch/central/
      # hosting เดียวกัน deploy พร้อมกันทุกครั้งที่ push main (ดู central/)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: central/package-lock.json

      - name: ติดตั้ง dependencies ของเว็บส่วนกลาง
        working-directory: central
        run: npm ci

      # แม่แบบฟอร์มเริ่มต้นของ app สร้างจากโค้ด web ทุกครั้งก่อน build
      # app จึงตรงกับ web เสมอ แม้ลืมรันเองหลังแก้ leaveTemplate.ts / tripTemplate.ts
      - name: สร้างแม่แบบฟอร์มเริ่มต้นให้ app
        working-directory: central
        run: npm run form-defaults

      - name: ติดตั้ง dependencies
        run: flutter pub get

      - name: ตรวจสอบโค้ด (ไม่บล็อกการ deploy)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # base-href ต้องเป็นชื่อ repo เพราะ Pages เสิร์ฟที่ /koragoch/
      - name: Build Flutter web
        run: flutter build web --release --base-href /koragoch/

      - name: Build เว็บผู้ดูแลส่วนกลาง
        working-directory: central
        run: npm run build

      - name: รวมเว็บส่วนกลางเข้าไปในเว็บหลัก
        run: cp -r central/dist build/web/central

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
