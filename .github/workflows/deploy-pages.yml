name: Deploy to GitHub Pages

# GitHub Pages (omkub.github.io/koragoch/) เลิกเสิร์ฟแอปแล้ว — ระบบย้ายไป
# Firebase Hosting rbp-chanikarnn.web.app (deploy-firebase.yml)
# ที่นี่เหลือแค่หน้าพาไปที่อยู่ใหม่ (hosting/pages-redirect/)
#   ทุกที่อยู่ใต้ /koragoch/ (รวม /central/) → หน้าเดียวกันที่ rbp-chanikarnn.web.app
#   sw.js ถอด service worker ของที่อยู่เก่าออกจากเครื่องที่เคยติดตั้ง
# deploy เฉพาะตอนไฟล์ในโฟลเดอร์นั้น / ไฟล์นี้เปลี่ยน

on:
  push:
    branches: [main]
    paths:
      - hosting/pages-redirect/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # หน้าเดียวกันเป็น 404.html ด้วย — ที่อยู่ที่ไม่มีไฟล์ (เช่น /koragoch/central/)
      # ก็ได้สคริปต์พาไปที่อยู่ใหม่
      - name: เตรียมหน้าพาไปที่อยู่ใหม่
        run: |
          mkdir -p site
          cp hosting/pages-redirect/index.html site/index.html
          cp hosting/pages-redirect/index.html site/404.html
          cp hosting/pages-redirect/sw.js site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
