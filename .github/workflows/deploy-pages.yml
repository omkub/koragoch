name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละครั้ง ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # เว็บผู้ดูแลระบบส่วนกลาง (React) — วางไว้ใต้แอป Flutter ที่ /koragoch/central/
      # hosting เดียวกัน deploy พร้อมกันทุกครั้งที่ push main (ดู central/)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: central/package-lock.json

      - name: ติดตั้ง dependencies ของเว็บส่วนกลาง
        working-directory: central
        run: npm ci

      # แม่แบบฟอร์มเริ่มต้นของ app สร้างจากโค้ด web ทุกครั้งก่อน build
      # app จึงตรงกับ web เสมอ แม้ลืมรันเองหลังแก้ leaveTemplate.ts / tripTemplate.ts
      - name: สร้างแม่แบบฟอร์มเริ่มต้นให้ app
        working-directory: central
        run: npm run form-defaults

      # ชุดทดสอบตัววาดเอกสาร: HTML ที่ web วาดจริงจากโค้ดล่าสุด
      - name: สร้างชุดทดสอบตัววาดเอกสารจาก web
        working-directory: central
        run: npm run form-fixtures

      - name: ติดตั้ง dependencies
        run: flutter pub get

      # ตัววาดของ app ต้องได้เอกสารเดียวกับ web ทุกตัวอักษร
      # ไม่ผ่าน = ไม่ deploy (เว็บเดิมยังใช้งานได้) ใบที่ครูพิมพ์จะได้ไม่ต่างจากที่ออกแบบไว้
      - name: เทียบตัววาดเอกสาร app กับ web
        run: flutter test test/form_template_test.dart test/form_render_parity_test.dart

      - name: ตรวจสอบโค้ด (ไม่บล็อกการ deploy)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # base-href ต้องเป็นชื่อ repo เพราะ Pages เสิร์ฟที่ /koragoch/
      - name: Build Flutter web
        run: flutter build web --release --base-href /koragoch/

      - name: Build เว็บผู้ดูแลส่วนกลาง
        working-directory: central
        run: npm run build

      - name: รวมเว็บส่วนกลางเข้าไปในเว็บหลัก
        run: cp -r central/dist build/web/central

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # merge หลาย PR ติดกัน รอบ deploy วิ่งพร้อมกันแล้วจบไม่ตามลำดับได้
      # (เคยเกิด: รอบของ PR เก่าจบทีหลัง เว็บเลยกลายเป็นเวอร์ชันเก่า)
      # deploy เฉพาะเมื่อรอบนี้ยังเป็น commit ล่าสุดของ main — มีใหม่กว่าแล้ว
      # ให้รอบของ commit ใหม่เป็นคน deploy
      - name: ตรวจว่ายังเป็นเวอร์ชันล่าสุดของ main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ข้าม deploy — main มี commit ใหม่กว่าแล้ว ($head)"
          fi

      - id: deployment
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
