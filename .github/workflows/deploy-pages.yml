name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละครั้ง ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ติดตั้ง dependencies
        run: flutter pub get

      - name: ตรวจสอบโค้ด (ไม่บล็อกการ deploy)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # base-href ต้องเป็นชื่อ repo เพราะ Pages เสิร์ฟที่ /koragoch/
      - name: Build Flutter web
        run: flutter build web --release --base-href /koragoch/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
