<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบวันลา — ย้ายแล้ว</title>
  <!--
    GitHub Pages (omkub.github.io/koragoch/) เลิกใช้แล้ว — ระบบย้ายไป Firebase Hosting
    พาไปหน้าเดียวกันที่ที่อยู่ใหม่ทันที (เก็บ path / query / #hash ไว้)
      /koragoch/            → https://rbp-chanikarnn.web.app/
      /koragoch/central/#/x → https://rbp-chanikarnn.web.app/central/#/x
    ไฟล์เดียวกันวางเป็น 404.html ด้วย ที่อยู่ไหนใต้ /koragoch/ ก็พาไปได้
    deploy โดย .github/workflows/deploy-pages.yml
  -->
  <script>
    (function () {
      var path = location.pathname.replace(/^\/koragoch(?=\/|$)/, '') || '/';
      location.replace('https://rbp-chanikarnn.web.app' + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="3; url=https://rbp-chanikarnn.web.app/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    main { text-align: center; padding: 24px; }
    a { color: #2563eb; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>ระบบวันลาย้ายที่อยู่แล้ว</h1>
    <p>กำลังพาไปที่อยู่ใหม่…</p>
    <p><a href="https://rbp-chanikarnn.web.app/">rbp-chanikarnn.web.app</a></p>
  </main>
</body>
</html>
