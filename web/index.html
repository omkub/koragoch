  <!-- 🔥 สคริปต์ดักจับคำสั่งปิดแอปเลื่อนหน้าขอใน LINE Browser 🕵️‍♂️🥇🏆 -->
  <script>
    // 🥇 ป้องกันการ "ลากลงเพื่อปิด" หรือ "ลากขึ้นเพื่อรีเฟรช" ใน LINE / iOS Safari
    window.addEventListener('touchstart', function(e) {
      this.startY = e.touches[0].pageY;
    }, {passive: false});

    window.addEventListener('touchmove', function(e) {
      const moveY = e.touches[0].pageY;
      // บล็อกการ Swipe ที่ขอบจอเพื่อป้องกัน Browser Hijack
      if (document.body.scrollTop <= 0 && moveY > this.startY) {
        // e.preventDefault(); // บล็อกการลากลงที่บนสุด
      }
    }, {passive: false});

    // 🏆 คำสั่งพิเศษสำหรับ Flutter Web เพื่อความลื่นไหล
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
  </script>

  <!--
    ติดตั้งแอปลงเครื่อง (มือถือ / PC) — เบราว์เซอร์ส่ง beforeinstallprompt มาตั้งแต่
    หน้ายังโหลดไม่เสร็จ ต้องดักไว้ก่อน Flutter เริ่ม แล้วให้ปุ่ม "ติดตั้งแอป" ในแอป
    (lib/widgets/install_app_button.dart) เรียกผ่าน koragochInstallInfo /
    koragochPromptInstall — iPhone ไม่มีอีเวนต์นี้ แอปจึงแสดงวิธีทำแทน
  -->
  <script>
    (function() {
      var deferred = null;
      var installed = false;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function() {
        deferred = null;
        installed = true;
      });
      window.koragochInstallInfo = function() {
        var ua = navigator.userAgent || '';
        var ios = /iphone|ipad|ipod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        return JSON.stringify({
          canPrompt: !!deferred,
          installed: installed,
          standalone: (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            navigator.standalone === true,
          ios: ios,
          android: /android/i.test(ua),
          inAppBrowser: /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua),
          safari: /safari/i.test(ua) && !/crios|fxios|edgios|chrome|android/i.test(ua)
        });
      };
      // กดปุ่มเร็วกว่าที่เบราว์เซอร์ส่งอีเวนต์มา — รอสูงสุด 3 วินาที
      function waitForPrompt() {
        if (deferred) return Promise.resolve(deferred);
        return new Promise(function(resolve) {
          var waited = 0;
          var timer = setInterval(function() {
            waited += 200;
            if (deferred || waited >= 3000) {
              clearInterval(timer);
              resolve(deferred);
            }
          }, 200);
        });
      }
      // แถบ "มีเวอร์ชันใหม่" (lib/widgets/update_banner.dart) — ดึงไฟล์หลักแบบ
      // ข้ามแคชของเบราว์เซอร์ก่อน แล้วรีโหลด จะได้เวอร์ชันใหม่จริง ไม่ใช่ตัวในแคช
      window.koragochReload = function() {
        var files = ['./', 'flutter_bootstrap.js?v=20261015-install-sw', 'main.dart.js'];
        Promise.all(files.map(function(f) {
          return fetch(f, { cache: 'reload' }).catch(function() {});
        })).then(function() { location.reload(); });
      };
      window.koragochPromptInstall = function() {
        return waitForPrompt().then(function(e) {
          if (!e) return 'unavailable';
          deferred = null;
          e.prompt();
          return e.userChoice
            .then(function(choice) { return choice.outcome; })
            .catch(function() { return 'dismissed'; });
        });
      };
    })();
  </script>

  <script>
    window.flutterfire_web_sdk_version = '11.9.1';
    window.schoolLeaveFirebaseModulesReady = new Promise(function(resolve, reject) {
      window.schoolLeaveResolveFirebaseModules = resolve;
      window.schoolLeaveRejectFirebaseModules = reject;
    });
  </script>
  <script type="module">
    import * as firebase_core from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
    import * as firebase_auth from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js';
    import * as firebase_firestore from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';
    import * as firebase_storage from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js';

    window.firebase_core = firebase_core;
    window.firebase_auth = firebase_auth;
    window.firebase_firestore = firebase_firestore;
    window.firebase_storage = firebase_storage;
    if (window.schoolLeaveResolveFirebaseModules) {
      window.schoolLeaveResolveFirebaseModules();
    }
  </script>
  <script nomodule>
    if (window.schoolLeaveRejectFirebaseModules) {
      window.schoolLeaveRejectFirebaseModules(
        new Error('Firebase modules require a modern browser')
      );
    }
  </script>

<body>
  <script>
    (function() {
      var cleanupKey = 'school_leave_sw_cleanup_version';
      // เปลี่ยนค่านี้ = ล้าง service worker / cache เก่าทุกเครื่องหนึ่งครั้ง
      // (20261015: ล้าง worker ของ Flutter ที่ค้างอยู่ ก่อนลงทะเบียน sw.js ของเรา)
      var cleanupVersion = '20261015-install-sw';

      function getCleanupVersion() {
        try {
          return window.localStorage.getItem(cleanupKey);
        } catch (error) {
          return null;
        }
      }

      function setCleanupVersion() {
        try {
          window.localStorage.setItem(cleanupKey, cleanupVersion);
        } catch (error) {}
      }

      function loadFlutter() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=20261015-install-sw';
        script.async = true;
        document.body.appendChild(script);
        registerInstallWorker();
      }

      // ทำให้ "ติดตั้งได้" ในทุกเบราว์เซอร์ที่รองรับ — web/sw.js ไม่แคชอะไร
      function registerInstallWorker() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {});
      }

      function waitForFirebaseModules() {
        var ready = window.schoolLeaveFirebaseModulesReady || Promise.resolve();
        var timeout = new Promise(function(resolve) {
          window.setTimeout(resolve, 8000);
        });
        return Promise.race([ready, timeout]).catch(function(error) {
          window.schoolLeaveFirebaseModulesError = error;
        });
      }

      function clearServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve();
        }
        return navigator.serviceWorker.getRegistrations()
          .then(function(registrations) {
            return Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          })
          .catch(function() {});
      }

      function clearCaches() {
        if (!window.caches || !caches.keys) {
          return Promise.resolve();
        }
        return caches.keys()
          .then(function(keys) {
            return Promise.all(keys.map(function(key) {
              return caches.delete(key);
            }));
          })
          .catch(function() {});
      }

      if (getCleanupVersion() !== cleanupVersion) {
        Promise.all([clearServiceWorkers(), clearCaches()])
          .then(setCleanupVersion)
          .catch(setCleanupVersion)
          .then(waitForFirebaseModules)
          .then(loadFlutter);
      } else {
        waitForFirebaseModules().then(loadFlutter);
      }
    })();
  </script>
