  <!-- 🔥 สคริปต์ดักจับคำสั่งปิดแอปเลื่อนหน้าขอใน LINE Browser 🕵️‍♂️🥇🏆 -->
  <script>
    // 🥇 ป้องกันการ "ลากลงเพื่อปิด" หรือ "ลากขึ้นเพื่อรีเฟรช" ใน LINE / iOS Safari
    window.addEventListener('touchstart', function(e) {
      this.startY = e.touches[0].pageY;
    }, {passive: false});

    window.addEventListener('touchmove', function(e) {
      const moveY = e.touches[0].pageY;
      // บล็อกการ Swipe ที่ขอบจอเพื่อป้องกัน Browser Hijack
      if (document.body.scrollTop <= 0 && moveY > this.startY) {
        // e.preventDefault(); // บล็อกการลากลงที่บนสุด
      }
    }, {passive: false});

    // 🏆 คำสั่งพิเศษสำหรับ Flutter Web เพื่อความลื่นไหล
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
  </script>

  <script>
    window.flutterfire_web_sdk_version = '11.9.1';
    window.schoolLeaveFirebaseModulesReady = new Promise(function(resolve, reject) {

      window.schoolLeaveRejectFirebaseModules = reject;
    });
  </script>
  <script type="module">
    import * as firebase_core from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
    import * as firebase_auth from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js';
    import * as firebase_firestore from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';
    import * as firebase_storage from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js';

    window.firebase_core = firebase_core;
    window.firebase_auth = firebase_auth;
    window.firebase_firestore = firebase_firestore;
    window.firebase_storage = firebase_storage;
    if (window.schoolLeaveResolveFirebaseModules) {
      window.schoolLeaveResolveFirebaseModules();
    }
  </script>
  <script nomodule>
    if (window.schoolLeaveRejectFirebaseModules) {
      window.schoolLeaveRejectFirebaseModules(
        new Error('Firebase modules require a modern browser')
      );
    }
  </script>
</head>
<body>
  <script>
    (function() {
      var cleanupKey = 'school_leave_sw_cleanup_version';
      var cleanupVersion = '20260808-firebase-module-preload';

      function getCleanupVersion() {
        try {
          return window.localStorage.getItem(cleanupKey);
        } catch (error) {
          return null;
        }
      }

      function setCleanupVersion() {
        try {
          window.localStorage.setItem(cleanupKey, cleanupVersion);
        } catch (error) {}
      }

      function loadFlutter() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=20260808-firebase-module-preload';
        script.async = true;
        document.body.appendChild(script);
      }

      function waitForFirebaseModules() {
        var ready = window.schoolLeaveFirebaseModulesReady || Promise.resolve();
        var timeout = new Promise(function(resolve) {
          window.setTimeout(resolve, 8000);
        });
        return Promise.race([ready, timeout]).catch(function(error) {
          window.schoolLeaveFirebaseModulesError = error;
        });
      }

      function clearServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve();
        }
        return navigator.serviceWorker.getRegistrations()
          .then(function(registrations) {
            return Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          })
          .catch(function() {});
      }

      function clearCaches() {
        if (!window.caches || !caches.keys) {
          return Promise.resolve();
        }
        return caches.keys()
          .then(function(keys) {
            return Promise.all(keys.map(function(key) {
              return caches.delete(key);
            }));
          })
          .catch(function() {});
      }

      if (getCleanupVersion() !== cleanupVersion) {
        Promise.all([clearServiceWorkers(), clearCaches()])
          .then(setCleanupVersion)
          .catch(setCleanupVersion)
          .then(waitForFirebaseModules)
          .then(loadFlutter);
      } else {
        waitForFirebaseModules().then(loadFlutter);
      }
    })();
  </script>
</body>
